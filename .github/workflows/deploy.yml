name: Deploy Web

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: urls
        run: |
          FRONTEND_URL=$(aws ssm get-parameter \
            --name "/nexus/prod/FRONTEND_URL" \
            --query Parameter.Value --output text)
          echo "api_url=${FRONTEND_URL}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/nexus-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/nexus-web:latest

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.NEXUS_EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy nexus-web ${{ github.sha }}" \
            --parameters commands='["sudo /usr/local/bin/nexus-deploy.sh web"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
